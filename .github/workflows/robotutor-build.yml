name: Robotutor Ketcher build
on:
  push:
    branches: [robotutor]
  pull_request:
    branches: [robotutor]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fork commit to build
        required: true
        type: string
      upstream_sha:
        description: Expected upstream commit in the candidate receipt
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'Weller-Precision-Industries/ketcher'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - name: Validate exact requested commit
        id: target
        env:
          TARGET: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_UPSTREAM: ${{ inputs.upstream_sha }}
        run: |
          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [ -n "$EXPECTED_UPSTREAM" ]; then
            [[ "$EXPECTED_UPSTREAM" =~ ^[a-f0-9]{40}$ ]] || exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify provenance and package operations
        env:
          EXPECTED_UPSTREAM: ${{ inputs.upstream_sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync('.robotutor/upstream.json', 'utf8'));
          if (receipt.repository !== 'epam/ketcher' || receipt.branch !== 'master' || !/^[a-f0-9]{40}$/.test(receipt.sha)) throw new Error('Invalid upstream receipt');
          if (process.env.EXPECTED_UPSTREAM && receipt.sha !== process.env.EXPECTED_UPSTREAM) throw new Error('Upstream receipt mismatch');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const name of ['build:packages', 'test', 'test:types']) if (!pkg.scripts?.[name]) throw new Error(`Missing upstream operation: ${name}`);
          JS
      - name: Install exactly the locked dependencies
        run: npm ci --engine-strict
      - name: Build fork packages
        run: npm run build:packages
      - name: Upstream unit and type checks
        run: |
          npm test
          npm run test:types
      # Upstream build/test signal stays green or red on its own merits; only
      # candidate artifacts require Robotutor's own regressions.
      - name: Check for Robotutor integration regressions
        id: qualification
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:robotutor'] ? 0 : 1)"; then
            echo "qualified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NOT QUALIFIED: add test:robotutor (reset/preload/undo/KET/identity/assistance) before candidate artifacts are produced."
            echo "qualified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Robotutor integration regressions
        if: steps.qualification.outputs.qualified == 'true'
        run: npm run test:robotutor
      - name: Package the matching fork workspaces and retain provenance
        if: steps.qualification.outputs.qualified == 'true'
        env:
          FORK_SHA: ${{ steps.target.outputs.sha }}
        run: |
          mkdir -p robotutor-artifacts
          npm pack --ignore-scripts --workspace=ketcher-core --workspace=ketcher-react --workspace=ketcher-standalone --workspace=ketcher-macromolecules --pack-destination=robotutor-artifacts
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, writeFileSync, copyFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const files = readdirSync('robotutor-artifacts').filter((p) => p.endsWith('.tgz'));
          if (files.length !== 4) throw new Error('Expected four compatible workspace tarballs');
          const upstream = JSON.parse(readFileSync('.robotutor/upstream.json', 'utf8'));
          const manifest = { repository: 'Weller-Precision-Industries/ketcher', forkSha: process.env.FORK_SHA,
            upstream, node: process.version, lockSha256: hash('package-lock.json'),
            artifacts: files.map((name) => ({ name, sha256: hash(`robotutor-artifacts/${name}`) })),
            status: 'candidate; not published or promoted to OLMS' };
          writeFileSync('robotutor-artifacts/manifest.json', JSON.stringify(manifest, null, 2));
          for (const name of readdirSync('.').filter((n) => /^(LICENSE|NOTICE)(\.|$)/.test(n))) copyFileSync(name, `robotutor-artifacts/${name}`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.qualification.outputs.qualified == 'true'
        with:
          name: robotutor-ketcher-${{ github.run_id }}
          path: robotutor-artifacts/
          if-no-files-found: error
          retention-days: 30
