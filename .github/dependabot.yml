version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: robotutor
    schedule:
      interval: weekly
      day: monday
      time: '11:47'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      ketcher-and-indigo:
        patterns: ['ketcher-*', '*indigo*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: robotutor
    schedule:
      interval: weekly
      day: monday
      time: '11:47'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
